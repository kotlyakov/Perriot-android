<div id="pierrot-action-proposal">
 <div class="viz-controls" role="group" aria-label="Источник карты">
  <button type="button" class="btn" data-scene="shop" aria-pressed="true">Товар магазина</button>
  <button type="button" class="btn" data-scene="owned" aria-pressed="false">Своя карта</button>
  <button type="button" class="btn" data-scene="pack" aria-pressed="false">Джокер из набора</button>
 </div>
 <div class="pp-table" data-scene="shop" aria-label="Предлагаемые области при перетаскивании карты">
  <div class="pp-buy pp-zone"><strong data-buy>КУПИТЬ</strong><span data-buy-detail>За $4</span></div>
  <div class="pp-sell pp-zone" data-off="true"><strong>ПРОДАТЬ</strong><span data-sell-detail>Своя карта</span></div>
  <div class="pp-content">
   <div class="pp-owned-row"><span>ДЖОКЕРЫ · 0/5</span><span>РАСХОДНИКИ · 1/2</span></div>
   <div class="pp-tray">
    <div class="pp-price" data-price>$4</div>
    <div class="pp-playing" data-card><div class="pp-illustration" data-art></div><strong data-name>Колесо фортуны</strong></div>
    <div class="pp-origin" data-origin>Магазин</div>
   </div>
   <div class="pp-pack-footer" hidden data-pack-footer>Пропустить набор</div>
  </div>
  <div class="pp-use pp-zone"><strong data-use>КУПИТЬ<br>И ПРИМЕНИТЬ</strong><span data-use-detail>За $4</span></div>
 </div>
 <p class="text-small" aria-live="polite" data-caption>Области появляются при перетаскивании карты.</p>
 <style>
 #pierrot-action-proposal .pp-table{--pp-side:clamp(84px,16vw,120px);display:grid;grid-template-columns:minmax(0,1fr) var(--pp-side);grid-template-rows:var(--pp-side) minmax(205px,1fr);gap:10px;background:#225449;color:#f6f2df;padding:12px;border-radius:12px;font-family:Rubik,Arial,sans-serif;margin-top:10px}
 #pierrot-action-proposal .pp-zone{border:3px solid #d6e2c9;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;text-align:center;padding:8px;box-shadow:0 4px #102e26;overflow-wrap:anywhere}
 #pierrot-action-proposal .pp-zone strong{font-size:clamp(12px,2.2vw,19px);font-weight:700;line-height:1.3}
 #pierrot-action-proposal .pp-zone span{font-size:12px;line-height:1.2}
 #pierrot-action-proposal .pp-buy{background:#287553;grid-area:1/1}
 #pierrot-action-proposal .pp-sell{background:#b55f25;border-color:#f6c35d;grid-area:1/2;aspect-ratio:1}
 #pierrot-action-proposal .pp-use{background:#327da3;border-color:#b2e2ee;grid-area:2/2}
 #pierrot-action-proposal .pp-zone[data-off=true]{background:#3d5550;border-color:#779087;color:#d3d9ce;box-shadow:none}
 #pierrot-action-proposal .pp-content{grid-area:2/1;min-width:0;display:flex;flex-direction:column;gap:14px;justify-content:space-between}
 #pierrot-action-proposal .pp-owned-row{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;font-size:11px;color:#d0dac7;line-height:1.4}
 #pierrot-action-proposal .pp-tray{position:relative;display:flex;flex-direction:column;align-items:center;gap:7px;padding:10px 8px;background:#193b35;border-radius:9px;min-height:190px}
 #pierrot-action-proposal .pp-price{color:#f6c35d;font-size:14px;font-weight:700}
 #pierrot-action-proposal .pp-playing{width:85px;height:116px;background:#d79d6e;border-radius:7px;box-shadow:0 5px #102a22;display:flex;flex-direction:column;align-items:center;overflow:hidden;padding:5px;transform:rotate(-6deg);color:#193d37}
 #pierrot-action-proposal .pp-illustration{flex:1;width:100%;min-height:0;display:grid;place-items:center}
 #pierrot-action-proposal .pp-illustration svg{height:100%;width:100%;display:block}
 #pierrot-action-proposal .pp-playing>strong{font-size:11px;text-align:center;line-height:1.1;font-weight:700;padding-top:2px}
 #pierrot-action-proposal .pp-origin{font-size:12px;color:#e8d5ad}
 #pierrot-action-proposal .pp-pack-footer{background:#bf5541;padding:10px;text-align:center;border-radius:7px;font-size:12px}
 #pierrot-action-proposal [hidden]{display:none!important}
 @media(min-width:620px){#pierrot-action-proposal .pp-content{min-height:265px}#pierrot-action-proposal .pp-playing{width:100px;height:140px}#pierrot-action-proposal .pp-tray{min-height:225px}}
