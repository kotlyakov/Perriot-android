name: Android APK CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Import approved Pierrot 0.4.5 web sources
        shell: bash
        run: |
          set -euo pipefail
          test -s baseline/pierrot-0.4.5-source.zip || { echo "Upload the approved source ZIP to baseline/pierrot-0.4.5-source.zip"; exit 1; }
          mkdir -p app/src/main/assets
          unzip -q baseline/pierrot-0.4.5-source.zip -d app/src/main/assets
          test -s app/src/main/assets/web/index.html
          test -s app/src/main/assets/src/ui/app.js
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "build-tools;35.0.0"
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$apk"
      - uses: actions/upload-artifact@v4
        with:
          name: pierrot-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
