<div id="pierrot-joker-gallery" lang="ru">
<style>
@font-face{font-family:JokerRubik;src:url('/*FONT*/') format('truetype');font-weight:300 900;font-display:swap}
#pierrot-joker-gallery{font-family:JokerRubik,sans-serif;color:#f0e5c8;position:relative;max-width:760px;margin:auto;padding:18px 14px 22px;background:#183332;border:5px solid #899c98;border-radius:18px;box-sizing:border-box;isolation:isolate}
#pierrot-joker-gallery *{box-sizing:border-box}
#pierrot-joker-gallery .gallery-heading{margin:0 100px 18px 0;display:flex;gap:12px;align-items:baseline;font-size:23px;font-weight:500}
#pierrot-joker-gallery .gallery-total{font-size:13px;opacity:.7;white-space:nowrap}
#pierrot-joker-gallery .joker-page{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px 14px;padding:14px;background:#102826;border-radius:10px}
#pierrot-joker-gallery [hidden]{display:none!important}
#pierrot-joker-gallery .gallery-joker{position:relative;display:block;aspect-ratio:71/95;width:100%;padding:0;border:3px solid #c9c5b5;border-radius:7px;background:#f0e5c8;color:#143d39;box-shadow:0 4px #081f20;overflow:hidden;touch-action:pan-y;transition:transform .18s;cursor:inherit;font-family:inherit}
#pierrot-joker-gallery .gallery-joker:focus-visible{outline:3px solid #f59b05;outline-offset:4px}
#pierrot-joker-gallery .gallery-joker[aria-describedby]{border-color:#f59b05;transform:translateY(-3px)}
#pierrot-joker-gallery .gallery-joker .print-plate{position:absolute;inset:0;display:block}
#pierrot-joker-gallery .print-plate svg{display:block;width:100%;height:100%}
#pierrot-joker-gallery .gallery-joker-name{position:absolute;left:3px;right:3px;bottom:6px;min-height:26px;display:flex;align-items:center;justify-content:center;font-size:clamp(10px,2.7vw,12px);line-height:1.1;font-weight:700;text-align:center;overflow-wrap:anywhere;white-space:normal;color:#fff1d6;background:none;-webkit-text-stroke:1.8px #20213f;paint-order:stroke fill;text-shadow:0 1px #20213f;z-index:3;pointer-events:none}
#pierrot-joker-gallery .gallery-pager{display:flex;align-items:center;justify-content:center;gap:20px;margin-top:20px}
#pierrot-joker-gallery .gallery-pager button{min-width:52px;min-height:44px;border:0;border-radius:7px;color:#f0e5c8;background:#bf4e43;box-shadow:0 4px #722f2b;font:500 24px JokerRubik,sans-serif;touch-action:manipulation;cursor:inherit}
#pierrot-joker-gallery .gallery-pager button:disabled{opacity:.4}
#pierrot-joker-gallery .gallery-pager output{min-width:64px;text-align:center;font-size:17px}
#pierrot-joker-gallery .gallery-tooltip{position:absolute;z-index:30;width:270px;padding:15px;background:#f0e5c8;border:3px solid #899c98;border-radius:10px;color:#143d39;box-shadow:0 8px 20px #071c2380;font-size:14px;line-height:1.4;text-align:left}
#pierrot-joker-gallery .gallery-tooltip .tooltip-title{font-size:19px;font-weight:500;display:block}
#pierrot-joker-gallery .gallery-tooltip p{margin:10px 0 0}
#pierrot-joker-gallery .tooltip-effect{font-weight:700}
#pierrot-joker-gallery .tooltip-chips{color:#176d95}
#pierrot-joker-gallery .tooltip-mult{color:#b23227}
#pierrot-joker-gallery .tooltip-money{color:#866016}
#pierrot-joker-gallery .gallery-rarity{font-size:12px;margin-top:3px}
@media(max-width:520px){#pierrot-joker-gallery{padding:14px 8px 18px;border-width:4px}#pierrot-joker-gallery .gallery-heading{font-size:20px;gap:8px;margin-bottom:14px}#pierrot-joker-gallery .joker-page{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 9px;padding:10px 8px}#pierrot-joker-gallery .gallery-joker{border-width:2px}#pierrot-joker-gallery .gallery-joker-name{font-size:clamp(10px,2.7vw,12px)}#pierrot-joker-gallery .gallery-total{font-size:12px}}
@media(prefers-reduced-motion:reduce){#pierrot-joker-gallery .gallery-joker{transition:none}}
</style>
<div class="gallery-heading">ДЖОКЕРЫ <span class="gallery-total">150 карт</span></div>
<div class="gallery-pages" aria-label="Коллекция джокеров">/*PAGES*/</div>
<nav class="gallery-pager" aria-label="Страницы коллекции"><button type="button" class="gallery-prev cursor-interaction" aria-label="Предыдущая страница">‹</button><output aria-live="polite">1 / 10</output><button type="button" class="gallery-next cursor-interaction" aria-label="Следующая страница">›</button></nav>
<script>
(()=>{
const root=document.getElementById('pierrot-joker-gallery');
const descriptions=/*DESCRIPTIONS*/;
/*ART_RENDERER*/
/*TOOLTIP*/
/*TOOLTIP_TEXT*/
const pages=[...root.querySelectorAll('.joker-page')],prev=root.querySelector('.gallery-prev'),next=root.querySelector('.gallery-next'),output=root.querySelector('output');let page=0,gesture=null,swiped=false;
function turn(value){const target=Math.max(0,Math.min(9,value));if(target===page)return;dismissCardTooltip();const old=pages[page],focusIndex=[...old.querySelectorAll('.gallery-joker')].indexOf(document.activeElement);old.hidden=true;page=target;const incoming=pages[page];incoming.hidden=false;prev.disabled=page===0;next.disabled=page===9;output.value=`${page+1} / 10`;if(focusIndex>=0)incoming.querySelectorAll('.gallery-joker')[focusIndex]?.focus({preventScroll:true});if(!matchMedia('(prefers-reduced-motion:reduce)').matches)incoming.animate([{opacity:.4,transform:`translateX(${target>Number(old.dataset.page)?12:-12}px)`},{opacity:1,transform:'translateX(0)'}],{duration:170,easing:'ease-out'});}
prev.disabled=true;prev.onclick=()=>turn(page-1);next.onclick=()=>turn(page+1);
root.querySelector('.gallery-pages').addEventListener('pointerdown',e=>{if(e.isPrimary===false||e.button>0)return;gesture={x:e.clientX,y:e.clientY};swiped=false;});
root.querySelector('.gallery-pages').addEventListener('pointerup',e=>{if(!gesture)return;const dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;gesture=null;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.3){swiped=true;turn(page+(dx<0?1:-1));}});
root.querySelector('.gallery-pages').addEventListener('pointercancel',()=>{gesture=null;});
root.querySelector('.gallery-pages').addEventListener('click',e=>{if(swiped){swiped=false;e.preventDefault();e.stopImmediatePropagation();return;}const card=e.target.closest('.gallery-joker');if(!card)return;const d=descriptions[card.dataset.entryId];const tip=document.createElement('aside');tip.className='gallery-tooltip';tip.id='joker_gallery_details';tip.setAttribute('role','tooltip');appendTooltipContents(tip,d.name,[d.description]);const rarity=document.createElement('div');rarity.className='gallery-rarity';rarity.textContent=d.rarity;tip.querySelector('strong').after(rarity);showCardTooltip(tip,card,{container:root});});
root.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();turn(page+1);}if(e.key==='ArrowLeft'){e.preventDefault();turn(page-1);}});
})();
</script>
</div>
